name: TrustForge Runtime Verification

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  pocketful:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pocketful
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: Upload verifier evidence when present
        if: hashFiles('pocketful/evidence/runtime-verification.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trustforge-runtime-evidence
          path: pocketful/evidence/runtime-verification.json
