name: TrustForge Runtime Verification

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  pocketful:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trustforge
          POSTGRES_PASSWORD: trustforge
          POSTGRES_DB: trustforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U trustforge -d trustforge"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: pocketful
    env:
      DATABASE_URL: postgresql://trustforge:trustforge@localhost:5432/trustforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
